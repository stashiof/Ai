name: Build Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare Permanent Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/my-upload-key.jks"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using custom repository signing secrets..."
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="$SECRET_STORE_PASSWORD"
            KEY_PASS="$SECRET_KEY_PASSWORD"
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using repository permanent keystore (consistent signature for in-place updates)..."
            tr -d '\n\r ' < debug.keystore.base64 | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="android"
            KEY_PASS="android"
            keytool -changealias \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PASS" \
              -alias androiddebugkey \
              -destalias upload \
              -keypass "$KEY_PASS"
          else
            echo "::error::Neither custom signing secrets nor debug.keystore.base64 were found."
            exit 1
          fi

          chmod 600 "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Assemble Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/my-upload-key.jks"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemBridge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
